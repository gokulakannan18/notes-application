<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Notes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p>Join and organize your notes</p>

            <form id="registerForm">
                <label>Name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="Enter email" required>

                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Create password" required minlength="6">

                <button type="submit">Register</button>
            </form>

            <p id="authMessage"></p>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
